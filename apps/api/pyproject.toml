[project]
name = "f1-api"
version = "0.1.0"
description = "FastAPI app for F1 Race Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "fastf1>=3.3.0",
    "f1-core>=0.1.0",
    "f1-features>=0.1.0",
    "f1-ingestion>=0.1.0",
    "f1-insights>=0.1.0",
    "f1-llm>=0.1.0",
    "f1-models>=0.1.0",
    "f1-processing>=0.1.0",
    "httpx>=0.30",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["f1_api*"]
